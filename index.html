<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offgrid</title>
    <style>
            :root {
                --tile-animation-duration: 0.15s;
                --tile-fill-diameter: 142%;
            }

            * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
            user-select: none;
        }

        body {
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 112px clamp(10px, 3vw, 24px) 24px;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10;
            width: 100%;
            padding: 10px clamp(10px, 3vw, 24px);
            background-color: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
        }

        .top-bar-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            max-width: 520px;
            margin: 0 auto;
        }

        .brand-and-status {
            order: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
        }

        .brand {
            color: #0f172a;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .container {
            background-color: #ffffff;
            border-radius: 20px;
            padding: clamp(14px, 4vw, 30px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            max-width: 460px;
            width: 100%;
            flex: none;
            justify-content: center;
        }

        .board-container {
            position: relative;
            background-color: #f1f5f9;
            padding: clamp(8px, 3vw, 16px);
            border-radius: 16px;
            border: 1px solid #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: min(100%, 400px);
            aspect-ratio: 1;
            flex: 0 1 auto;
        }

        .grid {
            display: grid;
            gap: clamp(4px, 1.5vw, 10px);
            flex: none;
            max-width: 100%;
            max-height: 100%;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            font-size: clamp(14px, 4vw, 22px);
            font-weight: bold;
            overflow: hidden;
        }

        .cell-content {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell.is-animating-on {
            background-color: #ffffff;
            border-color: #cbd5e1;
        }

        .cell.on.passive.is-animating-on {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }

        .cell.is-animating-on::before,
        .cell.is-animating-off::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            translate: -50% -50%;
            transform-origin: center;
            width: var(--tile-fill-diameter);
            aspect-ratio: 1;
            border-radius: 50%;
            background-color: #facc15;
            pointer-events: none;
            z-index: 0;
        }

        .cell.is-animating-on::before {
            animation: tile-fill var(--tile-animation-duration) ease-out forwards;
        }

        .cell.is-animating-off::before {
            animation: tile-shrink var(--tile-animation-duration) ease-in forwards;
        }

        .cell.passive.is-animating-on::before,
        .cell.passive.is-animating-off::before {
            background-color: #eab308;
        }

        @keyframes tile-fill {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        @keyframes tile-shrink {
            from { transform: scale(1); }
            to { transform: scale(0); }
        }

        .cell.empty {
            visibility: hidden;
            pointer-events: none;
        }

        .cell.off {
            background-color: #ffffff;
            border: 2px solid #cbd5e1;
            color: #64748b;
        }

        .cell.off:not(.passive):hover {
            border-color: #94a3b8;
        }

        .cell.on {
            background-color: #facc15;
            border: 2px solid #eab308;
            color: #854d0e;
        }

        .cell.passive {
            cursor: default;
            border-style: solid;
        }

        .cell.off.passive {
            background-color: #e2e8f0;
            border-color: #94a3b8;
            color: #64748b;
        }

        .cell.on.passive {
            background-color: #eab308;
            border-color: #ca8a04;
            color: #713f12;
        }

        .cell.on.is-animating-on {
            background-color: #ffffff;
            border-color: #cbd5e1;
        }

        .cell.on.passive.is-animating-on {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }

        .passive-icon {
            display: block;
            width: 40%;
            height: 40%;
            flex: none;
            pointer-events: none;
        }

        .direction-icon {
            display: block;
            width: 48%;
            height: 48%;
            flex: none;
            pointer-events: none;
        }

        .cell.preview {
            outline: 3px solid #3b82f6;
            outline-offset: -3px;
        }

        .cell.autoplay-target {
            animation: pulse-purple 0.8s infinite alternate;
        }

        @keyframes pulse-purple {
            0% { box-shadow: 0 0 0 2px #a855f7; transform: scale(0.96); }
            100% { box-shadow: 0 0 0 6px #7e22ce; transform: scale(1.04); }
        }

        .controls {
            order: 2;
            display: flex;
            gap: clamp(4px, 2vw, 10px);
            width: 100%;
        }

        .settings {
            width: 100%;
            margin-top: 16px;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background-color: #f8fafc;
        }

        .settings-title {
            margin-bottom: 8px;
            color: #334155;
            font-size: 13px;
            font-weight: 700;
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 34px;
            color: #475569;
            font-size: 13px;
            cursor: pointer;
        }

        .setting-switch {
            appearance: none;
            width: 36px;
            height: 20px;
            border: 0;
            border-radius: 999px;
            background-color: #cbd5e1;
            cursor: pointer;
            position: relative;
            transition: background-color 0.15s ease;
        }

        .setting-switch::before {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #ffffff;
            transition: transform 0.15s ease;
        }

        .setting-switch:checked {
            background-color: #2563eb;
        }

        .setting-switch:checked::before {
            transform: translateX(16px);
        }

        .setting-switch:focus-visible {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        .settings-note {
            margin-top: 6px;
            color: #64748b;
            font-size: 11px;
        }

        .btn {
            flex: 1;
            padding: 9px 10px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
            color: #334155;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
        }

        .btn:hover {
            background-color: #f8fafc;
            border-color: #94a3b8;
            color: #0f172a;
        }

        .btn.primary {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
        }

        .btn.primary:hover {
            background-color: #1d4ed8;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
        }

        .win-overlay {
            position: absolute;
            z-index: 2;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.92);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .win-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .win-title {
            font-size: 18px;
            font-weight: 800;
            color: #16a34a;
        }

        @media (max-width: 520px) {
            .btn {
                padding: 8px 4px;
                font-size: clamp(10px, 3vw, 12px);
            }
        }

    </style>
</head>
<body>

<div class="top-bar">
    <div class="top-bar-inner">
        <div class="brand-and-status">
            <div class="brand">Offgrid</div>
            <div class="status" id="moveCount">0</div>
        </div>
        <div class="controls">
            <button class="btn" id="resetBtn" onclick="resetCurrentLevel()">다시하기</button>
            <button class="btn" id="solveBtn" onclick="startAutoSolve()">정답 보기</button>
            <button class="btn primary" id="newBtn" onclick="initGame()">새 게임</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="board-container">
        <div class="grid" id="grid"></div>
        <div class="win-overlay" id="winOverlay">
            <div class="win-title">퍼즐을 해결했습니다.</div>
        </div>
    </div>
    <section class="settings" aria-labelledby="settingsTitle">
        <h2 class="settings-title" id="settingsTitle">타일 설정</h2>
        <label class="setting-row" for="directionSetting">
            <span>방향 타일</span>
            <input class="setting-switch" id="directionSetting" type="checkbox" role="switch" checked>
        </label>
        <label class="setting-row" for="knightSetting">
            <span>나이트 타일</span>
            <input class="setting-switch" id="knightSetting" type="checkbox" role="switch" checked>
        </label>
        <label class="setting-row" for="passiveSetting">
            <span>수동 타일</span>
            <input class="setting-switch" id="passiveSetting" type="checkbox" role="switch" checked>
        </label>
        <p class="settings-note">설정은 새 게임부터 적용됩니다.</p>
    </section>
</div>

<script>
    const CONFIG = {
        rows: 5,
        columns: 5,
        minActiveCellsPerLine: 3,
        minActiveRatio: 0.5,
        activeRatioRange: 0.35,
        tileTypeThresholds: {
            passive: 0.9,
            knight: 0.75,
            bidirectional: 0.7,
            direction: 0.6
        },
        solutionMinMoves: 4,
        solutionMoveRange: 4,
        autoplayStepMs: 700,
        autoplayHighlightMs: 300,
        maxCellSize: 68,
        minCellGap: 4,
        maxCellGap: 10,
        cellGapViewportRatio: 0.015
    };

    const TYPE_REGULAR = 'R';
    const TYPE_DIR = 'D';
    const TYPE_KNIGHT = 'K';
    const TYPE_PASSIVE = 'P';
    const TILE_SETTINGS = {
        direction: true,
        knight: true,
        passive: true
    };

    const PASSIVE_ICON_MARKUP = '<svg class="passive-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><line x1="5.64" y1="5.64" x2="18.36" y2="18.36"></line></svg>';
    const DIRS = [
        { r: -1, c: 0, path: 'M12 20V4 M8.5 7.5L12 4L15.5 7.5' },
        { r: 1, c: 0, path: 'M12 4V20 M8.5 16.5L12 20L15.5 16.5' },
        { r: 0, c: -1, path: 'M20 12H4 M7.5 8.5L4 12L7.5 15.5' },
        { r: 0, c: 1, path: 'M4 12H20 M16.5 8.5L20 12L16.5 15.5' }
    ];

    const KNIGHT_OFFSETS = [
        { r: -2, c: -1 }, { r: -2, c: 1 },
        { r: -1, c: -2 }, { r: -1, c: 2 },
        { r: 1, c: -2 },  { r: 1, c: 2 },
        { r: 2, c: -1 },  { r: 2, c: 1 }
    ];

    let board = [];
    let initialBoard = [];
    let solutionSteps = [];
    let moves = 0;
    let isAutoplay = false;
    let suppressPreview = false;
    let autoplayTimer = null;
    let autoplayStepTimeout = null;

    function initGame() {
        stopAutoplay();
        moves = 0;
        updateMoveDisplay();

        const { rows, columns } = CONFIG;
        const mask = Array.from({ length: rows }, () => Array(columns).fill(false));
        const targetCellCount = Math.round(rows * columns *
            (CONFIG.minActiveRatio + Math.random() * CONFIG.activeRatioRange));
        const fullRow = Math.floor(Math.random() * rows);
        const fullCol = Math.floor(Math.random() * columns);
        for (let c = 0; c < columns; c++) mask[fullRow][c] = true;
        for (let r = 0; r < rows; r++) mask[r][fullCol] = true;

        let activeCellCount = rows + columns - 1;
        while (activeCellCount < targetCellCount) {
            const frontier = [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < columns; c++) {
                    if (!mask[r][c]) continue;
                    [{ r: r - 1, c }, { r: r + 1, c }, { r, c: c - 1 }, { r, c: c + 1 }].forEach(pos => {
                        if (pos.r >= 0 && pos.r < rows && pos.c >= 0 && pos.c < columns && !mask[pos.r][pos.c]) {
                            frontier.push(pos);
                        }
                    });
                }
            }
            const next = frontier[Math.floor(Math.random() * frontier.length)];
            mask[next.r][next.c] = true;
            activeCellCount++;
        }

        for (let r = 0; r < rows; r++) {
            while (mask[r].filter(Boolean).length < CONFIG.minActiveCellsPerLine) {
                const availableCols = Array.from({ length: columns }, (_, c) => c).filter(c =>
                    !mask[r][c] && (
                        (c > 0 && mask[r][c - 1]) ||
                        (c < columns - 1 && mask[r][c + 1])
                    )
                );
                const index = Math.floor(Math.random() * availableCols.length);
                mask[r][availableCols.splice(index, 1)[0]] = true;
            }
        }

        for (let c = 0; c < columns; c++) {
            while (mask.reduce((count, row) => count + Number(row[c]), 0) < CONFIG.minActiveCellsPerLine) {
                const availableRows = Array.from({ length: rows }, (_, r) => r).filter(r =>
                    !mask[r][c] && (
                        (r > 0 && mask[r - 1][c]) ||
                        (r < rows - 1 && mask[r + 1][c])
                    )
                );
                const index = Math.floor(Math.random() * availableRows.length);
                mask[availableRows.splice(index, 1)[0]][c] = true;
            }
        }

        board = [];

        // 1. 보드 틀 생성
        for (let r = 0; r < rows; r++) {
            board[r] = [];
            for (let c = 0; c < columns; c++) {
                if (mask[r][c]) {
                    // 전등 종류 확률: 일반(60%), 방향(10%), 양방향(5%), 나이트(15%), 수동(10%)
                    const rand = Math.random();
                    let type = TYPE_REGULAR;
                    let dirIdxs = [];

                    if (rand > CONFIG.tileTypeThresholds.passive && TILE_SETTINGS.passive) {
                        type = TYPE_PASSIVE;
                    } else if (rand > CONFIG.tileTypeThresholds.knight && TILE_SETTINGS.knight) {
                        type = TYPE_KNIGHT;
                    } else if (rand > CONFIG.tileTypeThresholds.bidirectional && TILE_SETTINGS.direction) {
                        type = TYPE_DIR;
                        dirIdxs = pickRandomDirections(2);
                    } else if (rand > CONFIG.tileTypeThresholds.direction && TILE_SETTINGS.direction) {
                        type = TYPE_DIR;
                        dirIdxs = pickRandomDirections(1);
                    }

                    board[r][c] = {
                        active: true,
                        isOn: false,
                        type: type,
                        dirIdxs
                    };
                } else {
                    board[r][c] = { active: false, isOn: false };
                }
            }
        }

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < columns; c++) {
                const cell = board[r][c];
                if (cell.active && cell.type === TYPE_DIR) {
                    cell.dirIdxs = cell.dirIdxs.filter(dirIdx => hasActiveCellInDirection(r, c, dirIdx));
                    if (cell.dirIdxs.length === 0) {
                        cell.type = TYPE_REGULAR;
                    }
                }
            }
        }

        // 각 조작 가능한 전등이 다른 전등에 영향을 주고, 수동 타일도 영향을 받도록 보정합니다.
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < columns; c++) {
                if (board[r][c].active && board[r][c].type !== TYPE_PASSIVE &&
                    getAffectedCells(r, c).length === 1) {
                    board[r][c].type = TYPE_REGULAR;
                }
            }
        }

        ensureEnabledTileTypes();

        const interactiveCells = [];
        const passiveCells = [];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < columns; c++) {
                if (!board[r][c].active) continue;
                if (board[r][c].type === TYPE_PASSIVE) {
                    passiveCells.push({ r, c });
                } else {
                    interactiveCells.push({ r, c });
                }
            }
        }

        for (const passive of passiveCells) {
            const isAffected = interactiveCells.some(({ r, c }) =>
                getAffectedCells(r, c).some(pos => pos.r === passive.r && pos.c === passive.c)
            );
            if (!isAffected) {
                board[passive.r][passive.c].type = TYPE_REGULAR;
                interactiveCells.push(passive);
            }
        }

        ensureEnabledPassiveType();
        ensureInteractiveTilesAffectOthers();
        ensureEnabledTileTypes();
        ensureInteractiveTilesAffectOthers();
        interactiveCells.length = 0;
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < columns; c++) {
                if (board[r][c].active && board[r][c].type !== TYPE_PASSIVE) {
                    interactiveCells.push({ r, c });
                }
            }
        }

        // 2. 풀이 가능한 스테이지 역산 생성
        solutionSteps = [];
        const toggleCount = Math.min(
            interactiveCells.length,
            Math.floor(Math.random() * CONFIG.solutionMoveRange) + CONFIG.solutionMinMoves
        );
        const shuffled = [...interactiveCells];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }

        for (let i = 0; i < toggleCount; i++) {
            const target = shuffled[i];
            solutionSteps.push({ r: target.r, c: target.c });
            applyToggle(target.r, target.c);
        }

        if (!interactiveCells.some(pos => board[pos.r][pos.c].isOn)) {
            const target = interactiveCells[Math.floor(Math.random() * interactiveCells.length)];
            solutionSteps.push(target);
            applyToggle(target.r, target.c);
        }

        initialBoard = board.map(row => row.map(cell => ({ ...cell })));

        document.getElementById('winOverlay').classList.remove('show');
        renderBoard();
    }

    function ensureEnabledTileTypes() {
        const countType = type => board.flat().filter(cell => cell.active && cell.type === type).length;
        const canReplace = cell => cell.type === TYPE_REGULAR ||
            (cell.type === TYPE_DIR && countType(TYPE_DIR) > 1) ||
            (cell.type === TYPE_KNIGHT && countType(TYPE_KNIGHT) > 1) ||
            (cell.type === TYPE_PASSIVE && countType(TYPE_PASSIVE) > 1);

        if (TILE_SETTINGS.direction && countType(TYPE_DIR) === 0) {
            const candidates = [];
            for (let r = 0; r < CONFIG.rows; r++) {
                for (let c = 0; c < CONFIG.columns; c++) {
                    const cell = board[r][c];
                    if (!cell.active || cell.type === TYPE_PASSIVE || !canReplace(cell)) continue;
                    const availableDirections = DIRS.map((_, index) => index)
                        .filter(index => hasActiveCellInDirection(r, c, index));
                    if (availableDirections.length) candidates.push({ cell, availableDirections });
                }
            }
            if (candidates.length) {
                const candidate = candidates[Math.floor(Math.random() * candidates.length)];
                candidate.cell.type = TYPE_DIR;
                const direction = candidate.availableDirections[
                    Math.floor(Math.random() * candidate.availableDirections.length)
                ];
                candidate.cell.dirIdxs = [direction];
            }
        }

        if (TILE_SETTINGS.knight && countType(TYPE_KNIGHT) === 0) {
            const candidates = [];
            for (let r = 0; r < CONFIG.rows; r++) {
                for (let c = 0; c < CONFIG.columns; c++) {
                    const cell = board[r][c];
                    const canAffectAnother = KNIGHT_OFFSETS.some(offset =>
                        isValidCell(r + offset.r, c + offset.c)
                    );
                    if (cell.active && cell.type !== TYPE_PASSIVE && canReplace(cell) && canAffectAnother) {
                        candidates.push(cell);
                    }
                }
            }
            if (candidates.length) {
                const cell = candidates[Math.floor(Math.random() * candidates.length)];
                cell.type = TYPE_KNIGHT;
                cell.dirIdxs = [];
            }
        }

    }

    function ensureInteractiveTilesAffectOthers() {
        for (let r = 0; r < CONFIG.rows; r++) {
            for (let c = 0; c < CONFIG.columns; c++) {
                const cell = board[r][c];
                if (cell.active && cell.type !== TYPE_PASSIVE && getAffectedCells(r, c).length < 2) {
                    cell.type = TYPE_REGULAR;
                    cell.dirIdxs = [];
                }
            }
        }

        const hasIsolatedInteractiveTile = board.some((row, r) => row.some((cell, c) =>
            cell.active && cell.type !== TYPE_PASSIVE && getAffectedCells(r, c).length < 2
        ));
        if (hasIsolatedInteractiveTile) {
            throw new Error('Generated board has an interactive tile that affects no other tile.');
        }
    }

    function ensureEnabledPassiveType() {
        const countType = type => board.flat().filter(cell => cell.active && cell.type === type).length;
        if (!TILE_SETTINGS.passive || countType(TYPE_PASSIVE) > 0) return;

        const canReplace = cell => cell.type === TYPE_REGULAR ||
            (cell.type === TYPE_DIR && countType(TYPE_DIR) > 1) ||
            (cell.type === TYPE_KNIGHT && countType(TYPE_KNIGHT) > 1);
        const candidates = [];
        for (let r = 0; r < CONFIG.rows; r++) {
            for (let c = 0; c < CONFIG.columns; c++) {
                for (const offset of [{ r: -1, c: 0 }, { r: 1, c: 0 }, { r: 0, c: -1 }, { r: 0, c: 1 }]) {
                    const sourceRow = r + offset.r;
                    const sourceColumn = c + offset.c;
                    if (!isValidCell(r, c) || !isValidCell(sourceRow, sourceColumn)) continue;
                    const target = board[r][c];
                    const source = board[sourceRow][sourceColumn];
                    if (canReplace(target) && source.type !== TYPE_PASSIVE && canReplace(source)) {
                        candidates.push({ target, source });
                    }
                }
            }
        }
        if (candidates.length) {
            const { target, source } = candidates[Math.floor(Math.random() * candidates.length)];
            source.type = TYPE_REGULAR;
            source.dirIdxs = [];
            target.type = TYPE_PASSIVE;
            target.dirIdxs = [];
        }
    }

    function getAffectedCells(r, c) {
        const affected = [];
        if (!board[r] || !board[r][c] || !board[r][c].active) return affected;
        if (board[r][c].type === TYPE_PASSIVE) return affected;

        affected.push({ r, c });
        const cell = board[r][c];

        if (cell.type === TYPE_REGULAR) {
            const offsets = [{r:-1, c:0}, {r:1, c:0}, {r:0, c:-1}, {r:0, c:1}];
            offsets.forEach(o => {
                const nr = r + o.r, nc = c + o.c;
                if (isValidCell(nr, nc)) affected.push({ r: nr, c: nc });
            });
        } else if (cell.type === TYPE_DIR) {
            for (const dirIdx of cell.dirIdxs) {
                const dir = DIRS[dirIdx];
                let nr = r + dir.r;
                let nc = c + dir.c;
                while (nr >= 0 && nr < CONFIG.rows && nc >= 0 && nc < CONFIG.columns) {
                    if (board[nr][nc].active) {
                        affected.push({ r: nr, c: nc });
                    }
                    nr += dir.r;
                    nc += dir.c;
                }
            }
        } else if (cell.type === TYPE_KNIGHT) {
            KNIGHT_OFFSETS.forEach(o => {
                const nr = r + o.r, nc = c + o.c;
                if (isValidCell(nr, nc)) affected.push({ r: nr, c: nc });
            });
        }

        return affected;
    }

    function isValidCell(r, c) {
        return r >= 0 && r < CONFIG.rows && c >= 0 && c < CONFIG.columns && board[r][c].active;
    }

    function hasActiveCellInDirection(r, c, dirIdx) {
        const direction = DIRS[dirIdx];
        let nextRow = r + direction.r;
        let nextColumn = c + direction.c;
        while (nextRow >= 0 && nextRow < CONFIG.rows &&
            nextColumn >= 0 && nextColumn < CONFIG.columns) {
            if (board[nextRow][nextColumn].active) return true;
            nextRow += direction.r;
            nextColumn += direction.c;
        }
        return false;
    }

    function pickRandomDirections(count) {
        if (count === 2) {
            const direction = Math.floor(Math.random() * DIRS.length);
            return [direction, direction ^ 1];
        }

        const directions = DIRS.map((_, index) => index);
        for (let i = directions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [directions[i], directions[j]] = [directions[j], directions[i]];
        }
        return directions.slice(0, count);
    }

    function createDirectionIcon(dirIdxs) {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.classList.add('direction-icon');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor');
        svg.setAttribute('stroke-width', '2.5');
        svg.setAttribute('stroke-linecap', 'round');
        svg.setAttribute('stroke-linejoin', 'round');
        svg.setAttribute('aria-hidden', 'true');
        for (const dirIdx of dirIdxs) {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', DIRS[dirIdx].path);
            svg.appendChild(path);
        }
        return svg;
    }

    function applyToggle(r, c, capturePreviousStates = false) {
        const affected = getAffectedCells(r, c);
        const previousStates = capturePreviousStates ? new Map() : null;
        affected.forEach(pos => {
            if (previousStates) {
                previousStates.set(pos.r * CONFIG.columns + pos.c, board[pos.r][pos.c].isOn);
            }
            board[pos.r][pos.c].isOn = !board[pos.r][pos.c].isOn;
        });
        return previousStates;
    }

    function handleCellClick(r, c) {
        if (isAutoplay) return;
        suppressPreview = true;
        clearPreview();
        const previousStates = applyToggle(r, c, true);
        moves++;
        updateMoveDisplay();
        renderBoard(previousStates);
        checkWin();
    }

    function renderBoard(previousStates = null) {
        const gridElem = document.getElementById('grid');
        const boardElem = document.querySelector('.board-container');
        const boardStyles = getComputedStyle(boardElem);
        const horizontalPadding = parseFloat(boardStyles.paddingLeft) + parseFloat(boardStyles.paddingRight);
        const verticalPadding = parseFloat(boardStyles.paddingTop) + parseFloat(boardStyles.paddingBottom);
        const gap = Math.min(
            CONFIG.maxCellGap,
            Math.max(CONFIG.minCellGap, window.innerWidth * CONFIG.cellGapViewportRatio)
        );
        const availableWidth = boardElem.clientWidth - horizontalPadding;
        const availableHeight = boardElem.clientHeight - verticalPadding;
        const widthLimitedCellSize = (availableWidth - gap * (CONFIG.columns - 1)) / CONFIG.columns;
        const heightLimitedCellSize = (availableHeight - gap * (CONFIG.rows - 1)) / CONFIG.rows;
        const cellSize = Math.max(1, Math.min(CONFIG.maxCellSize, widthLimitedCellSize, heightLimitedCellSize));
        gridElem.style.setProperty('--cell-size', `${cellSize}px`);
        gridElem.style.gap = `${gap}px`;
        gridElem.style.gridTemplateColumns = `repeat(${CONFIG.columns}, ${cellSize}px)`;
        gridElem.style.gridTemplateRows = `repeat(${CONFIG.rows}, ${cellSize}px)`;
        const fragment = document.createDocumentFragment();

        for (let r = 0; r < CONFIG.rows; r++) {
            for (let c = 0; c < CONFIG.columns; c++) {
                const cellDiv = document.createElement('div');
                const cellData = board[r][c];

                if (!cellData.active) {
                    cellDiv.className = 'cell empty';
                } else {
                    cellDiv.className = `cell ${cellData.isOn ? 'on' : 'off'}`;
                    cellDiv.dataset.r = r;
                    cellDiv.dataset.c = c;
                    const previousState = previousStates
                        ? previousStates.get(r * CONFIG.columns + c)
                        : undefined;
                    if (previousState !== undefined && previousState !== cellData.isOn) {
                        cellDiv.classList.add(cellData.isOn ? 'is-animating-on' : 'is-animating-off');
                        cellDiv.addEventListener('animationend', () => {
                            cellDiv.classList.remove('is-animating-on', 'is-animating-off');
                        }, { once: true });
                    }

                    const content = document.createElement('span');
                    content.className = 'cell-content';
                    if (cellData.type === TYPE_PASSIVE) {
                        cellDiv.classList.add('passive');
                        content.innerHTML = PASSIVE_ICON_MARKUP;
                        cellDiv.title = '수동 타일';
                        cellDiv.setAttribute('aria-label', `수동 타일, ${cellData.isOn ? '켜짐' : '꺼짐'}`);
                    } else if (cellData.type === TYPE_DIR) {
                        content.appendChild(createDirectionIcon(cellData.dirIdxs));
                    } else if (cellData.type === TYPE_KNIGHT) {
                        content.textContent = '♞';
                    }
                    cellDiv.appendChild(content);

                    if (cellData.type !== TYPE_PASSIVE) {
                        cellDiv.addEventListener('mouseenter', () => showPreview(r, c));
                        cellDiv.addEventListener('mouseleave', handleCellMouseLeave);
                        cellDiv.addEventListener('click', () => handleCellClick(r, c));
                    }
                }

                fragment.appendChild(cellDiv);
            }
        }
        gridElem.replaceChildren(fragment);
    }

    function showPreview(r, c) {
        if (isAutoplay || suppressPreview) return;
        const affected = getAffectedCells(r, c);
        affected.forEach(pos => {
            const elem = document.querySelector(`.cell[data-r="${pos.r}"][data-c="${pos.c}"]`);
            if (elem) elem.classList.add('preview');
        });
    }

    function clearPreview() {
        document.querySelectorAll('.cell.preview').forEach(el => el.classList.remove('preview'));
    }

    function handleCellMouseLeave() {
        if (suppressPreview) suppressPreview = false;
        clearPreview();
    }

    function resetCurrentLevel() {
        stopAutoplay();
        moves = 0;
        updateMoveDisplay();
        board = initialBoard.map(row => row.map(cell => ({ ...cell })));
        document.getElementById('winOverlay').classList.remove('show');
        renderBoard();
    }

    function startAutoSolve() {
        if (isAutoplay) return;
        resetCurrentLevel();

        isAutoplay = true;
        document.getElementById('solveBtn').disabled = true;

        let stepIndex = 0;
        autoplayTimer = setInterval(() => {
            if (stepIndex >= solutionSteps.length) {
                stopAutoplay();
                checkWin();
                return;
            }

            const step = solutionSteps[stepIndex];
            const targetElem = document.querySelector(`.cell[data-r="${step.r}"][data-c="${step.c}"]`);

            if (targetElem) {
                targetElem.classList.add('autoplay-target');
                autoplayStepTimeout = setTimeout(() => {
                    autoplayStepTimeout = null;
                    if (!isAutoplay) return;
                    if (targetElem) targetElem.classList.remove('autoplay-target');
                    const previousStates = applyToggle(step.r, step.c, true);
                    moves++;
                    updateMoveDisplay();
                    renderBoard(previousStates);
                }, CONFIG.autoplayHighlightMs);
            }

            stepIndex++;
        }, CONFIG.autoplayStepMs);
    }

    function stopAutoplay() {
        if (autoplayTimer) clearInterval(autoplayTimer);
        if (autoplayStepTimeout) clearTimeout(autoplayStepTimeout);
        autoplayTimer = null;
        autoplayStepTimeout = null;
        isAutoplay = false;
        document.getElementById('solveBtn').disabled = false;
        document.querySelectorAll('.cell.autoplay-target').forEach(el => el.classList.remove('autoplay-target'));
    }

    function checkWin() {
        const allOff = board.every(row => row.every(cell => !cell.active || !cell.isOn));
        if (allOff) {
            stopAutoplay();
            document.getElementById('winOverlay').classList.add('show');
        }
    }

    function updateMoveDisplay() {
        document.getElementById('moveCount').textContent = moves;
    }

    document.querySelectorAll('.setting-switch').forEach(input => {
        input.addEventListener('change', () => {
            TILE_SETTINGS[input.id.replace('Setting', '')] = input.checked;
        });
    });

    window.addEventListener('resize', () => renderBoard());

    // 게임 시작
    initGame();
</script>
</body>
